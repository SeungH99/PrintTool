name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Verify ads-paused mode
        run: npm run e2e -- e2e/ads-paused.spec.ts
        env:
          NEXT_PUBLIC_ADSENSE_ENABLED: 'false'
      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build
      - name: Smoke test Cloudflare Worker
        run: node scripts/worker-smoke.mjs
